language: "typescript"
type: "library"
platform: "bun"

tasks:
  dev:
    command: "bunx ozaco build -w -f cjs -t node"
    deps:
      - "cli:dev"
      - "std:dev"
    inputs:
      - "src/**/*"
    outputs:
      - "dist/**"
  build:
    command: "bunx ozaco build -s -f cjs -t node"
    deps:
      - "cli:build"
      - "std:build"
    inputs:
      - "src/**/*"
    outputs:
      - "dist/**"
