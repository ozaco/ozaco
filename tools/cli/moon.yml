language: "typescript"
type: "library"
platform: "bun"

tasks:
  dev:
    command: "bun run src/main.ts build -s"
    inputs:
      - "src/**/*"
      - "packages/**/*"
    outputs:
      - "dist/**"
  build:
    command: "bun run src/main.ts build -s -m prod"
    inputs:
      - "src/**/*"
      - "packages/**/*"
    outputs:
      - "dist/**"
