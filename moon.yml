language: typescript
layer: library
toolchains:
  default: bun

tasks:
  check:
    options:
      affectedFiles: true
      runInCI: true
    script: bun x oxfmt --check && bun x oxlint
    toolchains: bun
  apply:
    options:
      affectedFiles: true
      runInCI: false
    script: bun x oxfmt && bun x oxlint --fix
    toolchains: bun
  apply-unsafe:
    options:
      affectedFiles: true
      runInCI: false
    script: bun x oxfmt && bun x oxlint --fix-dangerously
    toolchains: bun
