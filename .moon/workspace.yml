$schema: https://moonrepo.dev/schemas/workspace.json

projects:
  - apps/*
  - packages/*
  - plugins/*
  - experiments/*
  - examples/*
  - tools/*
  - .

vcs:
  client: git
  provider: github
  defaultBranch: rewrite
  hooks:
    pre-commit:
      - 'moon run :check'
    commit-msg:
      - 'bunx --no -- commitlint --edit $ARG1'
  sync: true
