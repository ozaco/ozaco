$schema: https://moonrepo.dev/schemas/workspace.json

projects:
  - apps/*
  - packages/*
  - plugins/*
  - experiments/*
  - tools/*

vcs:
  client: git
  provider: github
  defaultBranch: development
  hooks:
    pre-commit:
      - 'moon run :apply --affected --status=staged'
    commit-msg:
      - 'npx --no -- commitlint --edit $ARG1'
  sync: true
