$schema: 'https://moonrepo.dev/schemas/tasks.json'

implicitInputs:
  - 'package.json'

fileGroups:
  configs:
    - '*.config.{js,cjs,mjs}'
    - '*.json'
  sources:
    - 'src/**/*'
    - 'packages/**/*'
    - 'plugins/**/*'
    - 'types/**/*'
  tests:
    - 'tests/**/*'
    - '**/__tests__/**/*'
  assets:
    - 'assets/**/*'
    - 'images/**/*'
    - 'static/**/*'
    - '**/*.{scss,css}'

tasks:
  check:
    command: 'oxlint . && oxfmt --check .'
    options:
      affectedFiles: true
  apply:
    local: true
    command: 'oxfmt --write . && oxlint --fix .'
    options:
      affectedFiles: true
  apply-unsafe:
    local: true
    command: 'oxfmt --write . && oxlint --fix-dangerously .'
    options:
      affectedFiles: true
  clean:
    local: true
    command: 'rm -rf dist && rm -rf .ozaco'
    options:
      cache: false
      persistent: false
