name: 'Publish'

on:
  workflow_run:
    workflows: ['Pipeline']
    types: [completed]
    tags:
      - 'v*'

jobs:
  publish:
    name: 'Publish to npm'
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: 'ubuntu-latest'
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: 'actions/checkout@v6'
        with:
          fetch-depth: 0

      - uses: 'moonrepo/setup-toolchain@v0'
        with:
          auto-install: true

      - run: 'moon run std:build --color'

      - run: 'bun publish --access public'
        working-directory: 'packages/std'
