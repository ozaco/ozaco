name: 'Publish'

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    environment: production
    name: 'Publish to npm'
    runs-on: 'ubuntu-latest'
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: 'actions/checkout@v6'
        with:
          fetch-depth: 0

      - uses: 'moonrepo/setup-toolchain@v0'
        with:
          auto-install: true

      - run: 'bun install --frozen-lockfile'
      - run: 'moon run std:build server:build --color'

      - run: bun install -g npm

      - run: |
          echo "registry=https://registry.npmjs.org/" > "$HOME/.npmrc"
          echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" >> "$HOME/.npmrc"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - run: |
          bun pm pack
          npm publish ./*.tgz --access public --provenance
        working-directory: 'packages/std'

      - run: |
          bun pm pack
          npm publish ./*.tgz --access public --provenance
        working-directory: 'packages/server'
