language: typescript
layer: application
toolchains:
  default: bun

tasks:
  build:
    command: bun x tsdown
    deps:
      - devkit:build
      - client:build
    inputs:
      - src/**/*
      - tsdown.config.ts
    outputs:
      - dist/**/*
  types:
    command: bun x tsc -p tsconfig.json --noEmit
    deps:
      - std:build
      - server:build
      - db:build
      - client:build
    inputs:
      - src/**/*
