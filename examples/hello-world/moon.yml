language: typescript
layer: library
toolchains:
  default: bun

tasks:
  build:
    command: bunx tsdown
    inputs:
      - src/**/*
      - tsdown.config.ts
    outputs:
      - dist/**/*
    deps:
      - std:build
  run:
    command: bun run src/index.ts
    options:
      runInCI: false
    deps:
      - std:build
