language: typescript
layer: library
toolchains:
  default: bun

tasks:
  build:
    command: bun x tsdown -c packages/std/tsdown.config.ts
    inputs:
      - src/**/*
      - tsdown.config.ts
    outputs:
      - dist/**/*
    options:
      runFromWorkspaceRoot: true
  run:
    command: bun run src/index.ts
    deps:
      - std:build
    options:
      runInCI: false
