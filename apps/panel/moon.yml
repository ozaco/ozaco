language: typescript
layer: application
toolchains:
  default: bun

tasks:
  build:
    command: bun x vite build
    inputs:
      - index.html
      - src/**/*
      - vite.config.ts
    outputs:
      - dist/**/*
  # Regenerates the checked-in packages/server/.../docs/internal/panel.gen.ts from a fresh panel
  # build. Run `moon run panel:embed` after any panel change — server:build does NOT depend on it.
  embed:
    command: bun run scripts/embed.ts ../../packages/server/src/plugin/docs/internal/panel.gen.ts
    deps:
      - panel:build
    inputs:
      - dist/**/*
      - scripts/embed.ts
    options:
      cache: false
  types:
    command: bun x tsc -p tsconfig.json --noEmit
    inputs:
      - index.html
      - src/**/*
      - tests/**/*
      - vite.config.ts
      - tsconfig.json
  test:
    command: bun test --pass-with-no-tests
    inputs:
      - src/**/*
      - tests/**/*
    options:
      cache: false
