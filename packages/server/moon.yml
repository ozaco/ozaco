language: typescript
layer: library
toolchains:
  default: bun

tasks:
  build:
    # ensure-gen writes placeholder *.gen.ts modules when the real ones (git-ignored, written by
    # `moon run panel:embed` / `moon run observe:embed`) are not there yet — a task dep would put
    # server → panel → client → server into a cycle, so the demo/e2e tasks depend on the embeds
    script: bun run scripts/ensure-gen.ts && bun x tsdown --config-loader unrun
    deps:
      - std:build
      - transport:build
      - db:build
    inputs:
      - src/**/*
      - tsdown.config.ts
      - /packages/devkit/src/resolve.ts
    outputs:
      - dist/**/*
    options:
      # the git-ignored *.gen.ts embeds are invisible to moon's input hashing — never cache
      cache: false
  dev:
    command: bun x tsdown --config-loader unrun --watch
    inputs:
      - src/**/*
      - tsdown.config.ts
      - /packages/devkit/src/resolve.ts
    outputs:
      - dist/**/*
  types:
    script: bun run scripts/ensure-gen.ts && bun x tsc -p tsconfig.json --noEmit
    deps:
      - std:build
      - transport:build
      - db:build
    inputs:
      - src/**/*
      - tests/**/*
      - tsdown.config.ts
      - /packages/devkit/src/resolve.ts
  test:
    command: bun test --pass-with-no-tests
    deps:
      - server:build
    inputs:
      - tests/**/*
  test-network:
    command: bash scripts/test-network.sh
    deps:
      - server:build
    inputs:
      - src/**/*
      - tests/carrier/**/*
      - tests/suites/carrier.ts
      - scripts/test-network.sh
    options:
      cache: false
