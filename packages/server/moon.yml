language: typescript
layer: library
toolchains:
  default: bun

tasks:
  build:
    command: bun x tsdown --config-loader unrun
    deps:
      - std:build
      - panel:embed
    inputs:
      - src/**/*
      - tsdown.config.ts
    outputs:
      - dist/**/*
  dev:
    command: bun x tsdown --config-loader unrun --watch
    inputs:
      - src/**/*
      - tsdown.config.ts
    outputs:
      - dist/**/*
  types:
    command: bun x tsc -p tsconfig.json --noEmit
    deps:
      - std:build
    inputs:
      - src/**/*
      - tests/**/*
      - tsdown.config.ts
  test:
    command: bun test --pass-with-no-tests
    deps:
      - server:build
    inputs:
      - tests/**/*
  test-starrocks:
    command: bash scripts/test-starrocks.sh
    deps:
      - server:build
    inputs:
      - src/**/*
      - tests/**/*
      - scripts/test-starrocks.sh
    options:
      cache: false
  test-nats:
    command: bash scripts/test-nats.sh
    deps:
      - server:build
    inputs:
      - src/**/*
      - tests/**/*
      - scripts/test-nats.sh
    options:
      cache: false
  test-node:
    command: bash scripts/test-node.sh
    deps:
      - server:build
    inputs:
      - src/**/*
      - scripts/test-node.sh
      - scripts/smoke-node.mjs
      - scripts/smoke-node-child.mjs
    options:
      cache: false
  test-deno:
    command: bash scripts/test-deno.sh
    deps:
      - server:build
    inputs:
      - src/**/*
      - scripts/test-deno.sh
      - scripts/smoke-deno.mjs
    options:
      cache: false
