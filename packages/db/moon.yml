language: typescript
layer: library
toolchains:
  default: bun

tasks:
  build:
    command: bun x tsdown --config-loader unrun
    deps:
      - std:build
    inputs:
      - src/**/*
      - tsdown.config.ts
    outputs:
      - dist/**/*
  dev:
    command: bun x tsdown --config-loader unrun --watch
    inputs:
      - src/**/*
      - tsdown.config.ts
    outputs:
      - dist/**/*
  types:
    command: bun x tsc -p tsconfig.json --noEmit
    deps:
      - std:build
    inputs:
      - src/**/*
      - tests/**/*
      - tsdown.config.ts
  test:
    command: bun test --pass-with-no-tests
    deps:
      - db:build
    inputs:
      - tests/**/*
  test-pg:
    command: bash scripts/test-pg.sh
    deps:
      - db:build
    inputs:
      - src/**/*
      - tests/**/*
      - scripts/test-pg.sh
    options:
      cache: false
