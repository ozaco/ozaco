language: typescript
layer: library
toolchains:
  default: bun

tasks:
  build:
    command: bun x tsdown -c packages/std/tsdown.config.ts
    inputs:
      - src/**/*
      - tsdown.config.ts
    outputs:
      - dist/**/*
    options:
      runFromWorkspaceRoot: true
  dev:
    command: bun x tsdown --watch
    inputs:
      - src/**/*
      - tsdown.config.ts
    outputs:
      - dist/**/*
  test:
    command: bun test
    deps:
      - std:build
    inputs:
      - tests/**/*
