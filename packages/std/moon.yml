tasks:
  build:
    command: 'tsdown'
    inputs:
      - 'src/**/*'
      - 'tsdown.config.ts'
    outputs:
      - 'dist/**/*'
  dev:
    command: 'tsdown --watch'
    inputs:
      - 'src/**/*'
      - 'tsdown.config.ts'
    outputs:
      - 'dist/**/*'
  test:
    command: 'bun test'
    deps:
      - 'std:build'
    inputs:
      - 'tests/**/*'
