language: typescript
layer: library
toolchains:
  default: bun

tasks:
  build:
    command: bunx tsdown
    inputs:
      - src/**/*
      - tsdown.config.ts
    outputs:
      - dist/**/*
  dev:
    command: bunx tsdown --watch
    inputs:
      - src/**/*
      - tsdown.config.ts
    outputs:
      - dist/**/*
  test:
    command: bun test
    deps:
      - std:build
    inputs:
      - tests/**/*
