language: "typescript"
type: "library"
platform: "bun"

tasks:
  dev:
    command: "bunx ozaco build -s"
    deps:
      - "cli:dev"
    inputs:
      - "src/**/*"
    outputs:
      - "dist/**"
  build:
    command: "bunx ozaco build -s -m prod"
    deps:
      - "cli:build"
    inputs:
      - "src/**/*"
    outputs:
      - "dist/**"
  test:
    command: "bun test"
    deps:
      - "std:build"
    inputs:
      - "tests/**/*"
    local: true
