language: typescript
layer: library
toolchains:
  default: bun

tasks:
  build:
    command: bun x tsdown --config-loader unrun
    inputs:
      - src/**/*
      - tsdown.config.ts
      - /packages/devkit/src/resolve.ts
    outputs:
      - dist/**/*
  dev:
    command: bun x tsdown --config-loader unrun --watch
    inputs:
      - src/**/*
      - tsdown.config.ts
      - /packages/devkit/src/resolve.ts
    outputs:
      - dist/**/*
  types:
    command: bun x tsc -p tsconfig.json --noEmit
    inputs:
      - src/**/*
      - tsdown.config.ts
      - /packages/devkit/src/resolve.ts
  test:
    command: bun test --pass-with-no-tests
    deps:
      - std:build
    inputs:
      - tests/**/*
